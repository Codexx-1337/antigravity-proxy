# Antigravity Proxy Manager - sample config
# Copy this file to settings.ini and fill in your own proxy data,
# or just run Antigravity-Proxy.exe and set the values in the tray UI.
# pass= stays either plaintext or a DPAPI blob written by the manager itself.
type=HTTP
host=
port=0
user=
pass=
enforce=1
runAtLogon=0
startAntigravityAtLogon=0
minimizeToTray=1
stopWhenProxyDown=1
